claims:
  - claim: "PIPE-Cypher can generate a private, executable NL-to-Cypher benchmark over enterprise-style property graphs using local models."
    evidence: "The full Qwen3.5-9B fallback run exported 3,000 accepted examples: 2,000 FinBench and 1,000 SNB, with 375 examples in every planned workload category and all accepted examples passing read-only, syntax, schema, execution, non-empty-result, and judge gates."
    artifacts:
      - "artifacts/benchmarks/20260601_live_full_qwen9b"
      - "experiments/snapshots/20260601_live_full_qwen9b/manifest.json"
      - "paper_emnlp2026_industry/tables_benchmark_export.tex"
      - "paper_emnlp2026_industry/tables_full_results.tex"
    status: "Supported by live 9B fallback evidence; 35B target run is blocked by current GPU capacity."
    risk: "Generation quality may change with the target 35B model or with private enterprise schemas beyond FinBench/SNB."

  - claim: "Cypher-specific governance makes generated benchmark candidates safer and more auditable than prompt-only generation."
    evidence: "The pipeline validates read-only safety, schema-visible labels/properties/relationships, observed relationship direction, categorical values, contextual return columns, parser-style structure, execution success, and LLM-judge review. In the full run, only 2 of 4,777 candidates were schema-invalid after deterministic governance, and all 3,000 exported examples passed the deterministic and judge gates."
    artifacts:
      - "pipecypher/validator.py"
      - "pipecypher/cypher_parser.py"
      - "pipecypher/question_constraints.py"
      - "experiments/snapshots/20260601_live_full_qwen9b/failure_taxonomy.json"
      - "paper_emnlp2026_industry/tables_failure_taxonomy.tex"
    status: "Supported by code, tests, and full-run failure taxonomy."
    risk: "Semantic correctness still depends on execution evidence and judge review; human audit labels are pending."

  - claim: "Reverse grounding and structured workload seeds are designed to improve reliability under local-model constraints."
    evidence: "The target-50 FinBench/SNB ablation suite completed 14/14 graph/variant cells, reached every category target for all non-empty/non-unconstrained runs, and passed the paper-readiness audit with logs, model IDs, code revision, run summaries, and gate-rate availability. Appendix-only tables plus yield and gate-rate figures report the audited target-50 evidence while the target-100 follow-up and seeded target-50 repeat continue for stronger final reliability and variance claims."
    artifacts:
      - "scripts/run_live_ablation_suite.sh"
      - "scripts/monitor_remote_ablation_suite.py"
      - "scripts/monitor_remote_ablation_queue.py"
      - "scripts/collect_remote_ablation_suite.py"
      - "scripts/summarize_live_ablation_suite.py"
      - "knowledge_base/scaled_ablation_status.md"
      - "experiments/snapshots/20260601_ablation50_qwen9b/ablation_suite_summary.json"
      - "experiments/snapshots/20260601_ablation50_qwen9b/ablation_suite_audit.json"
      - "experiments/snapshots/20260601_ablation50_qwen9b/collection_manifest.json"
      - "paper_emnlp2026_industry/tables_ablation_results.tex"
      - "paper_emnlp2026_industry/tables_ablation_quality.tex"
      - "paper_emnlp2026_industry/figures/ablation_suite_target50.pdf"
      - "paper_emnlp2026_industry/figures/ablation_quality_target50.pdf"
    status: "Supported by audited target-50 appendix evidence; target-100 and seeded target-50 repeat runs are still pending for stronger final reliability claims."
    risk: "A single target-50 suite is the minimum publishable ablation scale, not the strongest possible evidence. If target-100 or repeated-seed runs complete, final claims should use those sensitivity results instead of relying only on target-50."

  - claim: "The benchmark controls category and difficulty balance while exposing residual diversity limits."
    evidence: "The full export has perfect category balance, planned 2:1 FinBench/SNB graph mix, and a near-even easy/medium split. Diversity diagnostics report Distinct-n, sampled self-BLEU-2, query-signature diversity, normalized entropy, schema coverage, structural feature rates, and aggregate value-grounding diagnostics. The full export uses 1,115 unique grounded entity values and exactly quotes grounded values in 82.6% of examples with entity bindings, making template and value concentration visible instead of hidden."
    artifacts:
      - "experiments/snapshots/20260601_live_full_qwen9b/diversity_report.json"
      - "paper_emnlp2026_industry/tables_diversity.tex"
      - "paper_emnlp2026_industry/figures/diversity_diagnostics.pdf"
      - "paper_emnlp2026_industry/figures/full_export_distribution.pdf"
    status: "Supported by full-export statistics and diversity diagnostics."
    risk: "Low query-signature diversity in the 9B fallback run remains a limitation and ablation target."

  - claim: "The generated benchmark is useful for downstream Text2Cypher evaluation."
    evidence: "A zero-shot local Qwen3.5-9B downstream evaluation over the 296-example full test split reports parse validity, schema validity, execution success, execution accuracy, answer F1, per-category breakdowns, and fixed-seed bootstrap uncertainty intervals. The model reaches 0.189 execution accuracy with a 95% bootstrap interval of [0.145, 0.233] and 0.622 execution success with interval [0.564, 0.676], showing the benchmark can discriminate easy aggregation from harder operational categories."
    artifacts:
      - "artifacts/evaluations/20260601_full_qwen9b_test_summary.json"
      - "experiments/snapshots/20260601_live_full_qwen9b/downstream_uncertainty.json"
      - "knowledge_base/downstream_evaluation.md"
      - "paper_emnlp2026_industry/tables_downstream_evaluation.tex"
      - "paper_emnlp2026_industry/tables_downstream_uncertainty.tex"
      - "paper_emnlp2026_industry/figures/downstream_breakdown.pdf"
      - "paper_emnlp2026_industry/figures/downstream_uncertainty.pdf"
    status: "Supported by live downstream evaluation against FinBench/SNB databases, with bootstrap uncertainty computed from row-level outputs."
    risk: "Only one downstream model has been evaluated so far."

  - claim: "Automated LLM-judge review can replace human-in-the-loop generation gates while still exposing judge risk."
    evidence: "The pipeline uses deterministic validation plus LLM-judge review as the generation gate. A post-hoc 80-row judge audit packet preserves 40 judge accepts, 40 judge rejects, both graphs, and all eight categories. Deterministic sidecar generation now creates two independent annotator sheets plus an adjudication template, with a tracked hash manifest that does not commit raw value-bearing sheets. The analyzer reports agreement, precision/recall, specificity, balanced accuracy, and Cohen's kappa only after the packet is completely human-labeled; partial labels are not treated as paper-ready calibration."
    artifacts:
      - "pipecypher/judge.py"
      - "pipecypher/calibration.py"
      - "pipecypher/judge_audit_packet.py"
      - "scripts/create_judge_annotation_sheets.py"
      - "scripts/analyze_judge_annotation_sheets.py"
      - "experiments/snapshots/20260601_live_full_qwen9b/judge_audit_packet_v2.json"
      - "experiments/snapshots/20260601_live_full_qwen9b/judge_annotation_sheets_manifest.json"
      - "experiments/snapshots/20260601_live_full_qwen9b/judge_annotation_agreement_unlabeled.json"
      - "knowledge_base/judge_audit_protocol.md"
      - "paper_emnlp2026_industry/tables_judge_audit_coverage.tex"
    status: "Pipeline gate is implemented; audit packet coverage is supported; judge-human agreement remains unreported until all audit rows are labeled."
    risk: "Judge-human agreement is not yet known because human labels are still blank."

  - claim: "The intended 35B local generation/judge path is staged but not currently runnable under observed shared-GPU constraints."
    evidence: "Qwen3.5-35B-A3B is staged on ds-serv6, but the capacity checker reports 68,573 MiB of weights, four required A5000 GPUs under the conservative vLLM budget, and only one safe GPU in the latest snapshot."
    artifacts:
      - "scripts/check_vllm_capacity.py"
      - "scripts/render_vllm_capacity_snapshot.py"
      - "knowledge_base/model_availability.md"
      - "knowledge_base/qwen35b_capacity_snapshot_20260601.md"
      - "experiments/snapshots/qwen35b_capacity_20260601_latest.json"
    status: "Documented blocker; current paper results are explicitly reported as Qwen3.5-9B fallback evidence."
    risk: "A later 35B run may change yield, diversity, judge behavior, and downstream conclusions."
