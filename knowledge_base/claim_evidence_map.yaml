claims:
  - claim: "PIPE-Cypher can generate a private, executable NL-to-Cypher benchmark over enterprise-style property graphs using local models."
    evidence: "The full local Qwen3.5-9B run exported 3,000 accepted examples: 2,000 FinBench and 1,000 SNB, with 375 examples in every planned workload category and all accepted examples passing read-only, syntax, schema, execution, non-empty-result, and judge gates."
    artifacts:
      - "artifacts/benchmarks/20260601_live_full_qwen9b"
      - "experiments/snapshots/20260601_live_full_qwen9b/manifest.json"
      - "paper_emnlp2026_industry/tables_benchmark_export.tex"
      - "paper_emnlp2026_industry/tables_full_results.tex"
    status: "Supported by live local-model evidence."
    risk: "Generation quality may change with private enterprise schemas beyond FinBench/SNB."

  - claim: "Cypher-specific governance makes generated benchmark candidates safer and more auditable than prompt-only generation."
    evidence: "The pipeline validates read-only safety, schema-visible labels, node and relationship properties, relationships, observed relationship direction, categorical values, contextual return columns, parser-style structure, execution success, and LLM-judge review. In the full run, only 2 of 4,777 candidates were schema-invalid after deterministic governance, and all 3,000 exported examples passed the deterministic and judge gates."
    artifacts:
      - "pipecypher/validator.py"
      - "pipecypher/cypher_parser.py"
      - "pipecypher/question_constraints.py"
      - "experiments/snapshots/20260601_live_full_qwen9b/failure_taxonomy.json"
      - "paper_emnlp2026_industry/tables_failure_taxonomy.tex"
    status: "Supported by code, tests, and full-run failure taxonomy."
    risk: "Semantic correctness still depends on execution evidence and judge review; the completed 80-row audit is a calibration sample rather than an exhaustive proof."

  - claim: "Reverse grounding and structured workload seeds are designed to improve reliability under local-model constraints."
    evidence: "Three FinBench/SNB ablation suites are complete and evidence-ready: the original target-50 suite, the corrected target-100 suite, and a seed-17 target-50 repeat. Each suite completed 14/14 graph/variant cells, reached every category target for all non-empty/non-unconstrained runs, and passed paper-readiness audits with logs, model IDs, code revisions, run summaries, collection manifests, and gate-rate availability. The target-100 suite is the detailed appendix ablation table/figure, while the three-suite comparison reports target-normalized coverage, acceptance variation, execution rates, and judge rates for stability."
    artifacts:
      - "scripts/run_live_ablation_suite.sh"
      - "scripts/monitor_remote_ablation_suite.py"
      - "scripts/monitor_remote_ablation_queue.py"
      - "scripts/collect_remote_ablation_suite.py"
      - "scripts/summarize_live_ablation_suite.py"
      - "knowledge_base/scaled_ablation_status.md"
      - "experiments/snapshots/20260601_ablation50_qwen9b/ablation_suite_summary.json"
      - "experiments/snapshots/20260601_ablation50_qwen9b/ablation_suite_audit.json"
      - "experiments/snapshots/20260601_ablation50_qwen9b/collection_manifest.json"
      - "experiments/snapshots/20260602_ablation100_qwen9b_catfix/ablation_suite_summary.json"
      - "experiments/snapshots/20260602_ablation100_qwen9b_catfix/ablation_suite_audit.json"
      - "experiments/snapshots/20260602_ablation100_qwen9b_catfix/collection_manifest.json"
      - "experiments/snapshots/20260602_ablation50_qwen9b_seed17_catfix/ablation_suite_summary.json"
      - "experiments/snapshots/20260602_ablation50_qwen9b_seed17_catfix/ablation_suite_audit.json"
      - "experiments/snapshots/20260602_ablation50_qwen9b_seed17_catfix/collection_manifest.json"
      - "experiments/snapshots/ablation_suite_comparison.json"
      - "paper_emnlp2026_industry/tables_ablation_results.tex"
      - "paper_emnlp2026_industry/tables_ablation_quality.tex"
      - "paper_emnlp2026_industry/tables_ablation_comparison.tex"
      - "paper_emnlp2026_industry/figures/ablation_suite_target100.pdf"
      - "paper_emnlp2026_industry/figures/ablation_quality_target100.pdf"
      - "paper_emnlp2026_industry/figures/ablation_suite_comparison.pdf"
      - "paper_emnlp2026_industry/figures/ablation_suite_target50.pdf"
      - "paper_emnlp2026_industry/figures/ablation_quality_target50.pdf"
    status: "Supported by audited target-100 evidence and three-suite target-size/repeated-seed comparison."
    risk: "The unconstrained local generation baseline produced no accepted examples under the strict executable gates, so comparisons against it should be framed as a gate-stress baseline rather than a tuned generation system."

  - claim: "The benchmark controls category and difficulty balance while exposing residual diversity limits."
    evidence: "The full export has perfect category balance, planned 2:1 FinBench/SNB graph mix, and a near-even easy/medium split. Diversity diagnostics report Distinct-n, sampled self-BLEU-2, query-signature diversity, normalized entropy, schema coverage, structural feature rates, and aggregate value-grounding diagnostics. The full export uses 1,115 unique grounded entity values and exactly quotes grounded values in 82.6% of examples with entity bindings, making template and value concentration visible instead of hidden."
    artifacts:
      - "experiments/snapshots/20260601_live_full_qwen9b/diversity_report.json"
      - "paper_emnlp2026_industry/tables_diversity.tex"
      - "paper_emnlp2026_industry/figures/diversity_diagnostics.pdf"
      - "paper_emnlp2026_industry/figures/full_export_distribution.pdf"
    status: "Supported by full-export statistics and diversity diagnostics."
    risk: "Low query-signature diversity in the reported local-model run remains a limitation and ablation target."

  - claim: "The generated benchmark is useful for downstream Text2Cypher evaluation."
    evidence: "A zero-shot local Qwen3.5-9B downstream evaluation over the 296-example full test split reports parse validity, schema validity, execution success, execution accuracy, answer F1, per-category breakdowns, fixed-seed bootstrap uncertainty intervals, and a row-level error taxonomy. The model reaches 0.189 execution accuracy with a 95% bootstrap interval of [0.145, 0.233] and 0.622 execution success with interval [0.564, 0.676]. The error taxonomy classifies 240 incorrect rows into answer mismatches, execution failures, schema invalid predictions, and parse-invalid predictions, showing the benchmark can discriminate easy aggregation from harder operational categories and can explain model failure modes."
    artifacts:
      - "artifacts/evaluations/20260601_full_qwen9b_test_summary.json"
      - "experiments/snapshots/20260601_live_full_qwen9b/downstream_uncertainty.json"
      - "experiments/snapshots/20260601_live_full_qwen9b/downstream_error_report.json"
      - "knowledge_base/downstream_evaluation.md"
      - "paper_emnlp2026_industry/tables_downstream_evaluation.tex"
      - "paper_emnlp2026_industry/tables_downstream_uncertainty.tex"
      - "paper_emnlp2026_industry/tables_downstream_error_taxonomy.tex"
      - "paper_emnlp2026_industry/figures/downstream_breakdown.pdf"
      - "paper_emnlp2026_industry/figures/downstream_uncertainty.pdf"
      - "paper_emnlp2026_industry/figures/downstream_error_taxonomy.pdf"
    status: "Supported by live downstream evaluation against FinBench/SNB databases, with bootstrap uncertainty computed from row-level outputs."
    risk: "Only one downstream model has been evaluated so far."

  - claim: "Automated LLM-judge review can replace human-in-the-loop generation gates while still exposing judge risk."
    evidence: "The pipeline uses deterministic validation plus LLM-judge review as the generation gate. A post-hoc 80-row judge audit packet preserves 40 judge accepts, 40 judge rejects, both graphs, and all eight categories. The completed human audit reports 80.0% agreement, Cohen's kappa 0.60, balanced accuracy 0.857, judge precision 1.00, judge specificity 1.00, judge recall 0.714, zero false accepts, and 16 false rejects. The analyzer requires complete labels for paper-facing calibration, and the tracked summary avoids committing raw value-bearing audit rows."
    artifacts:
      - "pipecypher/judge.py"
      - "pipecypher/calibration.py"
      - "pipecypher/judge_audit_packet.py"
      - "scripts/create_judge_annotation_sheets.py"
      - "scripts/analyze_judge_annotation_sheets.py"
      - "experiments/snapshots/20260601_live_full_qwen9b/judge_audit_packet_v2.json"
      - "experiments/snapshots/20260601_live_full_qwen9b/judge_annotation_sheets_manifest.json"
      - "experiments/snapshots/20260601_live_full_qwen9b/judge_calibration_filled_summary.json"
      - "knowledge_base/judge_audit_protocol.md"
      - "paper_emnlp2026_industry/tables_judge_audit_coverage.tex"
    status: "Supported by completed human audit summary."
    risk: "The judge appears conservative on this sample; larger audits or different enterprise schemas may reveal false accepts."

  - claim: "PIPE-Cypher supports arbitrary enterprise schema onboarding with configurable privacy redaction and value-sampling policies."
    evidence: "The repo includes an enterprise deployment guide, an enterprise template config, privacy config fields, schema introspection that reads categorical-value thresholds, maximum sampled value length, and omitted-property patterns from config, deterministic redaction helpers, and a redacted benchmark export CLI. The redaction policy replaces quoted Cypher literals, question mentions, entity values, and string-valued result samples with stable placeholders while preserving query structure and gate metadata. The repo now also includes an ICIJ Offshore Leaks onboarding profile, config, download/load helpers, graph plan, schema-derived sparse-category templates, and a completed sanitized target-100 onboarding audit on a public finance/compliance graph beyond the LDBC study workloads."
    artifacts:
      - "knowledge_base/enterprise_deployment_guide.md"
      - "knowledge_base/icij_offshoreleaks_graph_plan.md"
      - "configs/enterprise_template.yaml"
      - "configs/schema_icij_offshoreleaks.json"
      - "configs/icij_offshoreleaks_full.yaml"
      - "configs/schema_icij_offshoreleaks_live.json"
      - "experiments/snapshots/20260602_icij_target100_schema_templates_v3/onboarding_summary.json"
      - "experiments/snapshots/20260602_icij_target100_schema_templates_v3/collection_manifest.json"
      - "paper_emnlp2026_industry/tables_icij_onboarding.tex"
      - "paper_emnlp2026_industry/figures/icij_onboarding_audit.pdf"
      - "pipecypher/schema_templates.py"
      - "pipecypher/onboarding_audit.py"
      - "pipecypher/privacy.py"
      - "pipecypher/graph_profiles.py"
      - "scripts/redact_benchmark_export.py"
      - "scripts/collect_remote_onboarding_run.py"
      - "scripts/summarize_enterprise_onboarding_run.py"
      - "scripts/fetch_icij_offshoreleaks.sh"
      - "scripts/load_icij_neo4j_dump.sh"
      - "scripts/inspect_schema.py"
      - "tests/test_privacy.py"
      - "tests/test_schema.py"
      - "tests/test_graph_profiles.py"
      - "tests/test_schema_templates.py"
      - "tests/test_onboarding_audit.py"
    status: "Supported by docs, config, code, deterministic tests, a concrete third-graph onboarding plan, and a completed sanitized ICIJ target-100 live onboarding run with 800/983 accepted examples and 8/8 categories at target."
    risk: "ICIJ is public rather than private/anonymized enterprise data. The strongest industry validation would still come from a real tenant graph under the same audit protocol."
