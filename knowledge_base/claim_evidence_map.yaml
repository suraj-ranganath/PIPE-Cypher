claims:
  - claim: "PIPE-Cypher can generate a private, executable NL-to-Cypher benchmark over enterprise-style property graphs using local models."
    evidence: "The full local Qwen3.5-9B run exported 3,000 accepted examples: 2,000 FinBench and 1,000 SNB, with 375 examples in every planned workload category and all accepted examples passing read-only, syntax, schema, execution, non-empty-result, and judge gates."
    artifacts:
      - "artifacts/benchmarks/20260604_live_full_qwen9b_reviewfix"
      - "artifacts/benchmarks/20260604_live_full_qwen9b_reviewfix/manifest.json"
      - "experiments/snapshots/20260604_review_remediation/clean_qwen9b_submission_evidence_manifest.json"
      - "paper_emnlp2026_industry/tables_benchmark_export.tex"
      - "paper_emnlp2026_industry/tables_full_results.tex"
    status: "Supported by live local-model evidence."
    risk: "Generation quality may change with private enterprise schemas beyond FinBench/SNB."

  - claim: "Cypher-specific governance makes generated benchmark candidates safer and more auditable than prompt-only generation."
    evidence: "The pipeline validates read-only safety, schema-visible labels, node and relationship properties, relationships, observed relationship direction, categorical values, contextual return columns, parser-style structure, execution success, and LLM-judge review. In the clean full run, only 2 of 4,925 candidates were schema-invalid after deterministic governance, and all 3,000 exported examples passed the deterministic and judge gates."
    artifacts:
      - "pipecypher/validator.py"
      - "pipecypher/cypher_parser.py"
      - "pipecypher/question_constraints.py"
      - "experiments/snapshots/20260604_review_remediation/failure_taxonomy.json"
      - "paper_emnlp2026_industry/tables_failure_taxonomy.tex"
    status: "Supported by code, tests, and full-run failure taxonomy."
    risk: "Semantic correctness still depends on execution evidence and judge review; the completed 80-row audit is a calibration sample rather than an exhaustive proof."

  - claim: "Reverse grounding and structured workload seeds are designed to improve reliability under local-model constraints."
    evidence: "Three FinBench/SNB ablation suites are complete and evidence-ready: the original target-50 suite, the corrected target-100 suite, and a seed-17 target-50 repeat. Each suite completed 14/14 graph/variant cells, reached every category target for all non-empty/non-unconstrained runs, and passed paper-readiness audits with logs, model IDs, code revisions, run summaries, collection manifests, and gate-rate availability. The target-100 suite is the detailed appendix ablation table/figure, while the three-suite comparison reports target-normalized coverage, acceptance variation, execution rates, and judge rates for stability."
    artifacts:
      - "scripts/run_live_ablation_suite.sh"
      - "scripts/monitor_remote_ablation_suite.py"
      - "scripts/monitor_remote_ablation_queue.py"
      - "scripts/collect_remote_ablation_suite.py"
      - "scripts/summarize_live_ablation_suite.py"
      - "knowledge_base/scaled_ablation_status.md"
      - "experiments/snapshots/20260601_ablation50_qwen9b/ablation_suite_summary.json"
      - "experiments/snapshots/20260601_ablation50_qwen9b/ablation_suite_audit.json"
      - "experiments/snapshots/20260601_ablation50_qwen9b/collection_manifest.json"
      - "experiments/snapshots/20260602_ablation100_qwen9b_catfix/ablation_suite_summary.json"
      - "experiments/snapshots/20260602_ablation100_qwen9b_catfix/ablation_suite_audit.json"
      - "experiments/snapshots/20260602_ablation100_qwen9b_catfix/collection_manifest.json"
      - "experiments/snapshots/20260602_ablation50_qwen9b_seed17_catfix/ablation_suite_summary.json"
      - "experiments/snapshots/20260602_ablation50_qwen9b_seed17_catfix/ablation_suite_audit.json"
      - "experiments/snapshots/20260602_ablation50_qwen9b_seed17_catfix/collection_manifest.json"
      - "experiments/snapshots/ablation_suite_comparison.json"
      - "paper_emnlp2026_industry/tables_ablation_results.tex"
      - "paper_emnlp2026_industry/tables_ablation_quality.tex"
      - "paper_emnlp2026_industry/tables_ablation_comparison.tex"
      - "paper_emnlp2026_industry/figures/ablation_suite_target100.pdf"
      - "paper_emnlp2026_industry/figures/ablation_quality_target100.pdf"
      - "paper_emnlp2026_industry/figures/ablation_suite_comparison.pdf"
      - "paper_emnlp2026_industry/figures/ablation_suite_target50.pdf"
      - "paper_emnlp2026_industry/figures/ablation_quality_target50.pdf"
    status: "Supported by audited target-100 evidence and three-suite target-size/repeated-seed comparison."
    risk: "The repaired unconstrained local generation baseline produced accepted examples only in a narrow subset of categories: 200/422 accepted on FinBench across 2/8 categories and 50/2,000 accepted on SNB across 0/8 category targets. Comparisons against it should be framed as a gate-stress baseline rather than a tuned generation system."

  - claim: "The benchmark controls category and difficulty balance while exposing residual diversity limits."
    evidence: "The full export has perfect category balance, planned 2:1 FinBench/SNB graph mix, and a near-even easy/medium split. Diversity diagnostics report Distinct-n, sampled self-BLEU-2, query-signature diversity, normalized entropy, schema coverage, structural feature rates, and aggregate value-grounding diagnostics. The full export uses 1,115 unique grounded entity values and exactly quotes grounded values in 82.6% of examples with entity bindings, making template and value concentration visible instead of hidden."
    artifacts:
      - "experiments/snapshots/20260604_review_remediation/diversity_report.json"
      - "experiments/snapshots/20260604_diversity_governed_target50_reviewfix/diversity_improvement_comparison.json"
      - "paper_emnlp2026_industry/tables_diversity.tex"
      - "paper_emnlp2026_industry/tables_diversity_improvement.tex"
      - "paper_emnlp2026_industry/figures/diversity_diagnostics.pdf"
      - "paper_emnlp2026_industry/figures/full_export_distribution.pdf"
    status: "Supported by full-export statistics and diversity diagnostics."
    risk: "Low query-signature diversity in the reported local-model run remains a limitation and ablation target."

  - claim: "The generated benchmark is useful for downstream Text2Cypher evaluation."
    evidence: "An 11-model completed local downstream evaluation over the 296-example full test split reports parse validity, schema validity, execution success, execution accuracy, answer F1, per-category breakdowns, model-transfer summaries, few-shot control runs, leakage audits, and row-level error taxonomies. Zero-shot execution accuracy ranges from 0.000 to 0.203 with a mean of 0.036. Few-shot controls over the same split improve the mean to 0.200 for a scored no-signature condition that excludes exact query-signature matches and near-duplicate questions, and to 0.269/0.267 for ordered/random same-category example banks. Model-level paired bootstrap intervals show that gains are concentrated in compatible model families rather than universal."
    artifacts:
      - "artifacts/evaluations/20260604_clean_downstream_qwen35_9b_zero_fewshot/zero_shot_summary.json"
      - "experiments/snapshots/20260604_clean_downstream_model_transfer/downstream_control_manifest.json"
      - "experiments/snapshots/20260604_clean_downstream_model_transfer/model_transfer_summary.json"
      - "experiments/snapshots/20260604_clean_downstream_model_transfer/fewshot_control_summary.json"
      - "experiments/snapshots/20260604_clean_downstream_model_transfer/fewshot_control_uncertainty.json"
      - "experiments/snapshots/20260604_clean_downstream_model_transfer/fewshot_leakage_control_audit.json"
      - "experiments/snapshots/20260604_clean_downstream_model_transfer/downstream_uncertainty.json"
      - "experiments/snapshots/20260604_clean_downstream_model_transfer/downstream_error_report.json"
      - "knowledge_base/downstream_evaluation.md"
      - "paper_emnlp2026_industry/tables_downstream_evaluation.tex"
      - "paper_emnlp2026_industry/tables_downstream_fewshot_controls.tex"
      - "paper_emnlp2026_industry/tables_downstream_fewshot_control_uncertainty.tex"
      - "paper_emnlp2026_industry/tables_fewshot_leakage_controls.tex"
      - "paper_emnlp2026_industry/tables_downstream_error_taxonomy.tex"
      - "paper_emnlp2026_industry/figures/downstream_fewshot_controls.pdf"
      - "paper_emnlp2026_industry/figures/downstream_error_taxonomy.pdf"
    status: "INVALIDATED 2026-11-11: 8/11 checkpoints in the 20260604 clean suite had HTTP 404 on every request (empty predictions scored 0.000); scoring also gated execution on construction-time governance rules and required policy-injected context columns. Must be rerun with request-failure guards and projection-tolerant scoring before any downstream claim is made. See knowledge_base/eacl_revision_plan.md."
    risk: "Several local fine-tuned checkpoints remain brittle under few-shot prompting; the current study shows example-bank utility and transfer failure modes, not a completed tenant-specific fine-tuning result. The stricter no-signature improvement is an aggregate signal with broad model-family uncertainty rather than a universal model-level gain."

  - claim: "Automated LLM-judge review can serve as a generation gate with post-hoc human calibration while still exposing judge risk."
    evidence: "The pipeline uses deterministic validation plus LLM-judge review as the generation gate. A post-hoc 80-row judge audit packet preserves 40 judge accepts, 40 judge rejects, both graphs, and all eight categories. The completed human audit reports 80.0% agreement, Cohen's kappa 0.60, balanced accuracy 0.857, judge precision 1.00, judge specificity 1.00, judge recall 0.714, zero false accepts, and 16 false rejects. The analyzer requires complete labels for paper-facing calibration, and the tracked summary avoids committing raw value-bearing audit rows."
    artifacts:
      - "pipecypher/judge.py"
      - "pipecypher/calibration.py"
      - "pipecypher/judge_audit_packet.py"
      - "scripts/create_judge_annotation_sheets.py"
      - "scripts/analyze_judge_annotation_sheets.py"
      - "knowledge_base/judge_audit_protocol.md"
      - "paper_emnlp2026_industry/tables_judge_audit_coverage.tex"
    status: "Supported by completed human audit summary."
    risk: "The judge appears conservative on this sample; larger audits or different enterprise schemas may reveal false accepts."

  - claim: "PIPE-Cypher supports arbitrary enterprise schema onboarding with configurable privacy redaction and value-sampling policies."
    evidence: "The repo includes an enterprise deployment guide, an enterprise template config, privacy config fields, schema introspection that reads categorical-value thresholds, maximum sampled value length, and omitted-property patterns from config, deterministic redaction helpers, and a redacted benchmark export CLI. The redaction policy replaces quoted Cypher literals, question mentions, entity values, and string-valued result samples with stable placeholders while preserving query structure and gate metadata. The repo now also includes an ICIJ Offshore Leaks onboarding profile, config, download/load helpers, graph plan, schema-derived sparse-category templates, and a completed sanitized target-100 onboarding audit on a public finance/compliance graph beyond the LDBC study workloads."
    artifacts:
      - "knowledge_base/enterprise_deployment_guide.md"
      - "knowledge_base/icij_offshoreleaks_graph_plan.md"
      - "configs/enterprise_template.yaml"
      - "configs/schema_icij_offshoreleaks.json"
      - "configs/icij_offshoreleaks_full.yaml"
      - "configs/schema_icij_offshoreleaks_live.json"
      - "experiments/snapshots/20260602_icij_target100_schema_templates_v3/onboarding_summary.json"
      - "experiments/snapshots/20260602_icij_target100_schema_templates_v3/collection_manifest.json"
      - "paper_emnlp2026_industry/tables_icij_onboarding.tex"
      - "paper_emnlp2026_industry/figures/icij_onboarding_audit.pdf"
      - "pipecypher/schema_templates.py"
      - "pipecypher/onboarding_audit.py"
      - "pipecypher/privacy.py"
      - "pipecypher/graph_profiles.py"
      - "scripts/redact_benchmark_export.py"
      - "scripts/collect_remote_onboarding_run.py"
      - "scripts/summarize_enterprise_onboarding_run.py"
      - "scripts/fetch_icij_offshoreleaks.sh"
      - "scripts/load_icij_neo4j_dump.sh"
      - "scripts/inspect_schema.py"
      - "tests/test_privacy.py"
      - "tests/test_schema.py"
      - "tests/test_graph_profiles.py"
      - "tests/test_schema_templates.py"
      - "tests/test_onboarding_audit.py"
    status: "Supported by docs, config, code, deterministic tests, a concrete third-graph onboarding plan, and a completed sanitized ICIJ target-100 live onboarding run with 800/983 accepted examples and 8/8 categories at target."
    risk: "ICIJ is public rather than private/anonymized enterprise data. The strongest industry validation would still come from a real tenant graph under the same audit protocol."

# ---------------------------------------------------------------------------
# NAACL 2027 v2 claims (2026-11-12). They supersede the v1 claims above for the
# NAACL paper (paper_naacl2027_industry/). Full run log:
# experiments/snapshots/20261112_naacl_v2/status.md
# ---------------------------------------------------------------------------
naacl2027_v2_claims:
  - claim: "Signature quotas and template induction yield a balanced, structurally diverse benchmark with a template-held-out split."
    evidence: "2,080 items (FinBench 8x150, SNB 8x110); 1,312 signatures (v1: 123); min 19 signatures per cell; top-10 share 3.8% (v1: 67%); 0/216 held-out test items share a train signature (v1: 289/296)."
    artifacts: ["artifacts/benchmarks/naacl_v2_random", "artifacts/benchmarks/naacl_v2_heldout", "artifacts/naacl_results/diversity_v2.json", "artifacts/naacl_results/diversity_v1.json"]
    status: "Supported."
    risk: "Sampled self-BLEU did not improve; the hard tier is small (0.8%); half of rejected candidates (1,220 of 2,422) return empty results."
  - claim: "The generator does not favor its own items (no self-preference)."
    evidence: "Generator swap (GLM vs gpt-6-luna, judge fixed): DiD -0.002 [-0.085, 0.077] (GLM) and -0.008 [-0.098, 0.077] (gpt-6-luna), 11 models, signature-clustered bootstrap."
    artifacts: ["artifacts/naacl_results/results.json", "artifacts/benchmarks/naacl_v2_genswap_gpt6luna"]
    status: "Supported."
    risk: "Two generators only; the slices differ slightly in composition (category counts 26-32 vs 45-50)."
  - claim: "PIPE-Cypher benchmarks rank models like curated benchmarks on the same graph."
    evidence: "Kendall tau (projected EX, 11 models): recommendations 0.87, northwind 0.82, fincen 0.76; all permutation p<0.001; curated T2C-2024 test rows audited (569), oracle 1.000."
    artifacts: ["artifacts/naacl_results/results.json", "artifacts/external_benchmarks/t2c2024_d9f1554_recommended_audited", "artifacts/benchmarks/naacl_t2c_recommendations"]
    status: "Supported."
    risk: "The curated T2C-2024 queries are themselves LLM-generated and not human-verified; only 11 models; 109-120 items per generated benchmark."
  - claim: "Downstream conclusions are robust to which LLM judge is trusted, even though judges disagree."
    evidence: "gpt-6-luna flags 29% and Qwen3.5-9B 13% of accepted items (both 6.9%; inter-judge kappa 0.22). Dropping both-flagged items: ranking tau 1.00; keeping only gpt-6-luna-accepted items: tau 0.96 zero-shot, 0.89 few-shot."
    artifacts: ["artifacts/judges/naacl_v2/judge_agreement.json", "artifacts/naacl_results/judge_filter_robustness.json"]
    status: "Supported as a robustness claim. No reference error rate is claimed."
    risk: "No human labels for v2; the judge prompt's schema slice lacked the symmetric-type declaration (fixed after the runs)."
  - claim: "Stale benchmarks fail silently under schema change and data drift."
    evidence: "On a FinBench copy (1,200 v2 items): renames break 25.5% / 38.6%, with Neo4j returning empty or different rows rather than errors; data drift silently changes 9.4-12.1%; the stale benchmark overstates Qwen3.5-9B strict accuracy by 8.1 pp after M1; identity control 100% unchanged."
    artifacts: ["artifacts/refresh_v2", "artifacts/refresh_v2_misestimate", "artifacts/naacl_results/refresh"]
    status: "Supported."
    risk: "Synthetic migrations on one graph; misestimate measured for one model only."
  - claim: "Zero-shot transfer to unseen enterprise-style schemas is limited; few-shot from structurally different examples helps without saturating."
    evidence: "12 models on 216 held-out items: zero-shot projected EX median 0.35 (0.15-0.64); few-shot median 0.57 (0.39-0.72); Neo4j T2C Gemma-3-4B (native prompt) 0.35 vs 0.51 on its own curated domain."
    artifacts: ["artifacts/evaluations/naacl_v2_heldout_*", "artifacts/evaluations/naacl_v2_heldout_local_neo4j_gemma3_t2c"]
    status: "Supported."
    risk: "Hosted endpoints served open weights at released precision; only one T2C fine-tune could be run (local MLX)."
  - claim: "Downstream conclusions survive removing references with nondeterministic ORDER BY ... LIMIT answers."
    evidence: "Post-build deterministic audit: 65 of 283 ORDER BY ... LIMIT references tie at the cutoff, and 3 top-k items bind an entity id as k. Dropping the 10 affected held-out test items moves no model by more than 2.1 pp projected EX. Ranking tau versus the full test set: 0.96 (zero-shot), 1.00 (governed), 1.00 (few-shot)."
    artifacts: ["artifacts/naacl_results/limit_ties/summary.json", "artifacts/naacl_results/limit_ties/items.jsonl", "artifacts/naacl_results/limit_ties/rescore_heldout.json", "pipecypher/limit_ties.py", "scripts/audit_limit_ties.py"]
    status: "Supported as a robustness check. The released v2 set still contains these items."
    risk: "The gates (reject_limit_boundary_ties, max_rank_slot_value) were added after the build and are not active in the reported run."
