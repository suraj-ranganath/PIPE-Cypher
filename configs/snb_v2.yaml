# Benchmark v2 config (NAACL 2027 resubmission). Same graph/model/judge as
# configs/snb_full.yaml; adds signature quotas, LLM template induction,
# question paraphrase, a truncation gate, and symmetric KNOWS.
models:
  generation_model: Qwen/Qwen3.5-9B
  judge_model: Qwen/Qwen3.5-9B
  embedding_model: BAAI/bge-m3
  llm_base_url: http://localhost:8000/v1
  request_timeout_sec: 180
  temperature: 0.2
  max_tokens: 1024
  reasoning_effort: none
  include_reasoning: false
  enable_thinking: false
  strip_reasoning: true

neo4j:
  uri: bolt://localhost:7688
  user: neo4j
  password: password
  database: neo4j
  query_timeout_sec: 90

generation:
  graph_profile: snb
  categories:
    - simple_retrieval
    - complex_retrieval
    - simple_aggregation
    - complex_aggregation
    - boolean_existence
    - negation_difference
    - path_temporal
    - ranking_topk
  target_per_category: 125
  template_candidates: 12
  template_source: mixed
  retrieval_top_k: 4
  repair_attempts: 2
  deterministic_cypher_fallback: true
  max_entity_pct: 0.08
  require_non_empty: true
  # --- benchmark v2 (NAACL 2027): structural diversity + reference validity ---
  mixed_keep_llm_templates: true
  max_examples_per_signature: 8
  template_induction_rounds: 6
  template_induction_batch: 10
  max_attempts_multiplier: 8
  question_paraphrase: true
  reject_truncated_unordered_limit: true
  # Added after the 2026-11-12 v2 build (which ran without them). Enable for the
  # next build; see artifacts/naacl_results/limit_ties/:
  # reject_limit_boundary_ties: true
  # max_rank_slot_value: 100
  require_slot_bindings: true
  symmetric_relationships:
    - KNOWS
  generated_query_limit: 200

judge:
  enabled: true
  deterministic_fallback: true
  min_semantic_alignment: 0.78
  min_schema_use: 0.85
  max_ambiguity: 0.30

paths:
  artifact_dir: artifacts
  schema_path: configs/schema_snb.json
  seed_examples_path:

privacy:
  # v2 grounds many slots on numeric ids; numeric literals must be redacted in exports
  # (see the v2 redaction audit).
  redact_numeric_literals: true
