models:
  generation_model: Qwen/Qwen3.5-9B
  judge_model: Qwen/Qwen3.5-9B
  embedding_model: BAAI/bge-m3
  llm_base_url: http://localhost:8000/v1
  request_timeout_sec: 120
  temperature: 0.2
  max_tokens: 1024
  reasoning_effort: none
  include_reasoning: false
  enable_thinking: false
  strip_reasoning: true

neo4j:
  uri: bolt://localhost:7687
  user: neo4j
  password: CHANGE_ME
  database: neo4j
  query_timeout_sec: 60

generation:
  graph_profile: enterprise_private
  categories:
    - simple_retrieval
    - complex_retrieval
    - simple_aggregation
    - complex_aggregation
    - boolean_existence
    - negation_difference
    - path_temporal
    - ranking_topk
  target_per_category: 50
  template_source: mixed
  retrieval_top_k: 3
  normalize_cypher: true
  repair_attempts: 1
  deterministic_cypher_fallback: true
  require_non_empty: true
  generated_query_limit: 50

judge:
  enabled: true
  deterministic_fallback: true
  min_semantic_alignment: 0.75
  min_schema_use: 0.8
  max_ambiguity: 0.35

privacy:
  redact_questions: true
  redact_cypher_literals: true
  redact_entity_values: true
  redact_result_samples: true
  redact_numeric_literals: false
  value_sampling_mode: bounded
  categorical_max_values: 12
  categorical_max_value_chars: 80
  categorical_omitted_properties:
    - "*.address"
    - "*.comments"
    - "*.note"
    - "*.notes"
    - "*.original_address"
  placeholder_prefix: VALUE

paths:
  artifact_dir: artifacts
  schema_path: configs/schema_enterprise_private.json
