# E3.4/E3.5 external-anchor graph: FinCEN Files filings graph (suspicious-activity filings between entities and banks).
# Public Neo4j example graph neo4j-graph-examples (see knowledge_base/external_anchor_protocol.md).
# Load: GRAPHS=fincen bash scripts/fetch_neo4j_example_graphs.sh <download_dir>  (bolt port 7703).
# Schema: paths.schema_path is written on ds-serv6 by
#   python scripts/inspect_schema.py --config configs/t2c_fincen.yaml
# configs/schema_t2c_fincen_derived.json is parsed from the dataset's schema text
# (offline checks / schema-drift only); runs must use the live schema.
# Structure mirrors configs/icij_offshoreleaks_full.yaml; the generation block adds the
# benchmark-v2 keys used by configs/finbench_v2.yaml so E3.5 validates the same generator.
models:
  generation_model: Qwen/Qwen3.5-9B
  judge_model: Qwen/Qwen3.5-9B
  embedding_model: BAAI/bge-m3
  llm_base_url: http://localhost:8000/v1
  request_timeout_sec: 180
  temperature: 0.2
  max_tokens: 1024
  reasoning_effort: none
  include_reasoning: false
  enable_thinking: false
  strip_reasoning: true

neo4j:
  uri: bolt://localhost:7703
  user: neo4j
  password: password
  database: neo4j
  query_timeout_sec: 90

generation:
  graph_profile: t2c_fincen
  categories:
    - simple_retrieval
    - complex_retrieval
    - simple_aggregation
    - complex_aggregation
    - boolean_existence
    - negation_difference
    - path_temporal
    - ranking_topk
  target_per_category: 50
  random_seed: 20261111
  template_candidates: 12
  template_source: mixed
  retrieval_top_k: 4
  normalize_cypher: true
  repair_attempts: 2
  deterministic_cypher_fallback: true
  max_entity_pct: 0.08
  require_non_empty: true
  # --- benchmark v2 keys (match configs/finbench_v2.yaml) ---
  mixed_keep_llm_templates: true
  max_examples_per_signature: 8
  template_induction_rounds: 6
  template_induction_batch: 10
  max_attempts_multiplier: 8
  question_paraphrase: true
  reject_truncated_unordered_limit: true
  generated_query_limit: 300

judge:
  enabled: true
  deterministic_fallback: true
  min_semantic_alignment: 0.78
  min_schema_use: 0.85
  max_ambiguity: 0.30

privacy:
  redact_questions: true
  redact_cypher_literals: true
  redact_entity_values: true
  redact_result_samples: true
  redact_numeric_literals: false
  value_sampling_mode: bounded
  categorical_max_values: 20
  categorical_max_value_chars: 80
  categorical_omitted_properties:
    - "*.address"
    - "*.comments"
    - "*.note"
    - "*.notes"
    - "*.original_address"
  placeholder_prefix: VALUE

paths:
  artifact_dir: artifacts
  schema_path: configs/schema_t2c_fincen.json
  seed_examples_path:
