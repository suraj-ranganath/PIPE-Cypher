# PIPE-Cypher downstream Text2Cypher model manifest (NAACL 2027 Industry resubmission).
#
# This is NOT a RunConfig. Do not pass it to scripts/validate_config.py,
# scripts/run_pipeline.py, or pipecypher.config.load_config: it is read only by
# scripts/run_downstream_suite.py (load_model_manifest), which validates it with
# its own strict schema and rejects unknown keys.
#
# Verification (2026-11-11): every hf_id / adapter / base id below was resolved
# through the public Hugging Face API (https://huggingface.co/api/models/<id>);
# hf_sha is the first 12 characters of the repo head commit at that time.
# Model-card prompt formats are recorded verbatim in
# knowledge_base/downstream_prompt_formats.md and pipecypher/prompt_formats.py.
#
# GPU sizing targets ds-serv6 RTX A5000 cards (24 GB each). gpu_memory_estimate_gb
# is weights plus a working KV/activation budget at max_model_len 4096, summed
# over gpus_required. Never launch on GPUs with another user's resident
# processes; --launch requires explicit --gpu-ids.
#
# system_message_mode: "merge" only for chat templates that reject the system
# role (Gemma 2). Documented native formats that send a single user turn send no
# system message at all, regardless of this setting.

manifest_kind: pipecypher_downstream_model_manifest
manifest_version: 1
title: NAACL 2027 downstream Text2Cypher transfer suite
verified_on: "2026-11-11"
verification_method: Hugging Face public API and raw model cards (no paid APIs)

hardware:
  host: ds-serv6.ucsd.edu
  gpu: NVIDIA RTX A5000
  gpu_memory_gb: 24

defaults:
  provider: vllm
  port: 8000
  dtype: bfloat16
  max_model_len: 4096
  quantization: null
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.88
  system_message_mode: separate
  base_vllm_args:
    - --no-enable-flashinfer-autotune
    - --enforce-eager
    - --max-num-seqs
    - "1"
    - --max-num-batched-tokens
    - "4096"

launch:
  serve_script: scripts/serve_qwen_vllm.sh
  # Rendered by run_downstream_suite.py --launch (shown verbatim with --dry-run).
  # {vllm_args} = base_vllm_args + --dtype/--quantization + LoRA flags + extra_args.
  command_template: >-
    CUDA_VISIBLE_DEVICES={gpu_ids} PORT={port} SERVED_MODEL_NAME={base_served_model_name}
    TENSOR_PARALLEL_SIZE={tensor_parallel_size} MAX_MODEL_LEN={max_model_len}
    GPU_MEMORY_UTILIZATION={gpu_memory_utilization} EXTRA_VLLM_ARGS=
    bash scripts/serve_qwen_vllm.sh {serve_model} {vllm_args}
  health_timeout_sec: 1800

