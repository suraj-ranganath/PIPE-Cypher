# Benchmark v2 (NAACL 2027 resubmission), generator + primary judge GLM-5.3-Flash.
# Same pipeline and quotas as configs/finbench_v2.yaml. Public LDBC graph only.
# Keys: OPENROUTER_API_KEY from the environment. Spend: PIPE_CYPHER_USAGE_LEDGER +
# PIPE_CYPHER_MAX_COST_USD.
models:
  # GLM-5.3-Flash: open weights (MIT, zai-org/GLM-5.3-Flash, 321B params, released in FP8).
  # Served through OpenRouter, pinned to Z.ai's own FP8 endpoint (native precision,
  # no FP4/NVFP4 re-quantization, no fallback to other endpoints).
  generation_model: z-ai/glm-5.3-flash
  judge_model: z-ai/glm-5.3-flash
  embedding_model: BAAI/bge-m3
  llm_base_url: https://openrouter.ai/api/v1
  provider: openrouter
  provider_routing:
    order:
      - z-ai/fp8
    allow_fallbacks: false
    require_parameters: true
  request_timeout_sec: 180
  temperature: 0.2
  max_tokens: 2048
  # Reasoning is mandatory for this model; "low" is the cheapest allowed effort.
  # Reasoning text is excluded from responses (never written to artifacts).
  reasoning_effort: low
  include_reasoning: false
  enable_thinking: false
  strip_reasoning: true
neo4j:
  uri: bolt://localhost:7687
  user: neo4j
  password: password
  database: neo4j
  query_timeout_sec: 90

generation:
  graph_profile: finbench
  categories:
    - simple_retrieval
    - complex_retrieval
    - simple_aggregation
    - complex_aggregation
    - boolean_existence
    - negation_difference
    - path_temporal
    - ranking_topk
  target_per_category: 250
  template_candidates: 12
  template_source: mixed
  retrieval_top_k: 4
  repair_attempts: 2
  deterministic_cypher_fallback: true
  max_entity_pct: 0.08
  require_non_empty: true
  # --- benchmark v2 (NAACL 2027): structural diversity + reference validity ---
  mixed_keep_llm_templates: true
  max_examples_per_signature: 8
  template_induction_rounds: 6
  template_induction_batch: 10
  max_attempts_multiplier: 8
  question_paraphrase: true
  reject_truncated_unordered_limit: true
  # Added after the 2026-11-12 v2 build (which ran without them). Enable for the
  # next build; see artifacts/naacl_results/limit_ties/:
  # reject_limit_boundary_ties: true
  # max_rank_slot_value: 100
  require_slot_bindings: true
  generated_query_limit: 300

judge:
  enabled: true
  # Fail closed: an LLM judge error rejects the candidate (no rule-based acceptance).
  deterministic_fallback: false
  min_semantic_alignment: 0.78
  min_schema_use: 0.85
  max_ambiguity: 0.30

paths:
  artifact_dir: artifacts
  schema_path: configs/schema_finbench.json
  seed_examples_path:

privacy:
  # v2 grounds many slots on numeric ids; numeric literals must be redacted in exports
  # (see the v2 redaction audit).
  redact_numeric_literals: true
