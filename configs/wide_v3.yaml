# Wide-schema stress test (NAACL 2027 v3; reviewer concern C8: schemas with 100+ labels).
# One Neo4j database holding FinBench, SNB, Recommendations, Northwind, and FinCEN, each copied
# four times with namespaced labels and relationship types (scripts/build_wide_schema_graph.py),
# so every label holds real data. Same v3 pipeline, GLM-5.3-Flash generator and GLM + Gemma-4 panel
# as the main build; no hand-written seed templates (schema-derived + LLM templates only).
# Live instance: jamming bolt 7720 (loopback). Schema: python scripts/inspect_schema.py --config <this>.
models:
  # GLM-5.3-Flash: open weights (MIT, zai-org/GLM-5.3-Flash, 321B params, released in FP8).
  # Served through OpenRouter, pinned to Z.ai's own FP8 endpoint (native precision,
  # no FP4/NVFP4 re-quantization, no fallback to other endpoints).
  generation_model: z-ai/glm-5.3-flash
  judge_model: z-ai/glm-5.3-flash
  embedding_model: BAAI/bge-m3
  llm_base_url: https://openrouter.ai/api/v1
  provider: openrouter
  provider_routing:
    order:
      - novita/fp8
    allow_fallbacks: false
    require_parameters: true
  request_timeout_sec: 180
  request_seed: 20261113
  temperature: 0.2
  max_tokens: 2048
  # Reasoning is mandatory for this model; "low" is the cheapest allowed effort.
  # Reasoning text is excluded from responses (never written to artifacts).
  reasoning_effort: low
  include_reasoning: false
  enable_thinking: false
  strip_reasoning: true
neo4j:
  uri: bolt://localhost:7720
  user: neo4j
  password: password
  database: neo4j
  query_timeout_sec: 90

generation:
  graph_profile: wide_multidomain
  categories:
    - simple_retrieval
    - complex_retrieval
    - simple_aggregation
    - complex_aggregation
    - boolean_existence
    - negation_difference
    - path_temporal
    - ranking_topk
  target_per_category: 10
  random_seed: 20261111
  template_candidates: 12
  template_source: mixed
  retrieval_top_k: 4
  normalize_cypher: true
  repair_attempts: 2
  deterministic_cypher_fallback: true
  max_entity_pct: 0.08
  require_non_empty: true
  # --- benchmark v2 keys (match configs/finbench_v2.yaml) ---
  mixed_keep_llm_templates: true
  max_examples_per_signature: 8
  template_induction_rounds: 6
  template_induction_batch: 10
  max_attempts_multiplier: 8
  question_paraphrase: true
  reject_truncated_unordered_limit: true
  reject_limit_boundary_ties: true
  max_rank_slot_value: 100
  require_slot_bindings: true
  # --- v3 ---
  template_cypher: true
  outcome_aware_binding: true
  binding_verify_attempts: 12
  template_cypher_fallback: true
  literal_consistency_gate: true
  convention_sheet: true
  realization_styles:
    - terse_analyst
    - business_manager
    - imperative
    - context_first
  paraphrase_candidates: 2
  prompt_profile: full_pipe_cypher_governed_v3
  random_seed: 1
  symmetric_relationships:
    - SNBA_KNOWS
    - SNBB_KNOWS
    - SNBC_KNOWS
    - SNBD_KNOWS
  generated_query_limit: 300

judge:
  enabled: true
  # Fail closed: an LLM judge error rejects the candidate (no rule-based acceptance).
  deterministic_fallback: false
  # v3 judge: checklist with the shared convention sheet, frozen after calibration
  # (artifacts/naacl_v3/calibration/frozen_judge_v3.json). Gate = panel of GLM
  # (models.judge_model, Novita FP8) + Gemma-4-26B-A4B (BF16); both must accept.
  mode: checklist
  schema_mode: full
  panel:
    - label: gemma4
      model: google/gemma-4-26b-a4b-it
      reasoning_effort: none
      max_tokens: 2048
      provider_routing:
        order:
          - primeintellect/bf16
        allow_fallbacks: false
        require_parameters: true
  min_semantic_alignment: 0.78
  min_schema_use: 0.85
  max_ambiguity: 0.30

paths:
  artifact_dir: artifacts
  schema_path: configs/schema_wide_v3.json
  seed_examples_path:
