models:
  generation_model: Qwen/Qwen3.5-9B
  judge_model: Qwen/Qwen3.5-9B
  embedding_model: BAAI/bge-m3
  llm_base_url: http://localhost:8000/v1
  request_timeout_sec: 180
  temperature: 0.2
  max_tokens: 1024
  reasoning_effort: none
  include_reasoning: false
  enable_thinking: false
  strip_reasoning: true

neo4j:
  uri: bolt://localhost:7689
  user: neo4j
  password: password
  database: neo4j
  query_timeout_sec: 90

generation:
  graph_profile: icij_offshoreleaks
  categories:
    - simple_retrieval
    - complex_retrieval
    - simple_aggregation
    - complex_aggregation
    - boolean_existence
    - negation_difference
    - path_temporal
    - ranking_topk
  target_per_category: 100
  template_candidates: 12
  template_source: mixed
  retrieval_top_k: 4
  normalize_cypher: true
  repair_attempts: 2
  deterministic_cypher_fallback: true
  max_entity_pct: 0.08
  require_non_empty: true
  generated_query_limit: 300

judge:
  enabled: true
  deterministic_fallback: true
  min_semantic_alignment: 0.78
  min_schema_use: 0.85
  max_ambiguity: 0.30

privacy:
  redact_questions: true
  redact_cypher_literals: true
  redact_entity_values: true
  redact_result_samples: true
  redact_numeric_literals: false
  value_sampling_mode: bounded
  categorical_max_values: 20
  categorical_max_value_chars: 80
  categorical_omitted_properties:
    - "*.address"
    - "*.comments"
    - "*.note"
    - "*.notes"
    - "*.original_address"
  placeholder_prefix: VALUE

paths:
  artifact_dir: artifacts
  schema_path: configs/schema_icij_offshoreleaks_live.json
  seed_examples_path:
